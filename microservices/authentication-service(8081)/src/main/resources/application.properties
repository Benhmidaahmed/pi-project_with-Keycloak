spring.application.name=authentication-service
server.port=8081

spring.data.mongodb.uri=mongodb://localhost:27017/wassalni
spring.data.mongodb.auto-index-creation=true

eureka.client.service-url.defaultZone=http://localhost:8083/eureka/
eureka.instance.prefer-ip-address=true

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/wassalni-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/wassalni-realm/protocol/openid-connect/certs

# Keycloak Admin Configuration
keycloak.server-url=http://localhost:8080
keycloak.realm=wassalni-realm
keycloak.client-id=wassalni-app
keycloak.client-secret=wassalni-secret-key-2024
keycloak.admin-username=admin
keycloak.admin-password=admin
